[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

[program:mariadb]
command=/usr/sbin/mysqld
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.err

[program:redis]
command=redis-server
priority=2
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:frappe-bench]
command=bench start
directory=/home/frappe/frappe-bench
user=frappe
priority=3
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/frappe-bench.log
stderr_logfile=/var/log/supervisor/frappe-bench.err

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock 